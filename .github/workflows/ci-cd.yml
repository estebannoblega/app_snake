name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests y validación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests unitarios
        run: node --test --test-reporter=spec tests/*.test.js

      - name: Validar script de deploy
        run: shellcheck scripts/deploy.sh

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Build de la imagen
        run: docker compose build

      - name: Smoke test del contenedor en proxy-net
        run: |
          docker network create proxy-net
          docker compose up -d --wait --wait-timeout 60
          cid="$(docker compose ps -q snake)"
          if [ -n "$(docker port "$cid")" ]; then
            echo "::error::El contenedor publica puertos en el host"; exit 1
          fi
          docker run --rm --network proxy-net --entrypoint wget snake-cicd:latest -q -O - http://snake-cicd/ | grep '<title>Snake</title>' >/dev/null
          echo "Contenedor healthy y respondiendo en http://snake-cicd/ dentro de proxy-net"

      - name: Logs del contenedor (si falló)
        if: failure()
        run: docker compose logs

      - name: Limpieza
        if: always()
        run: docker compose down

  deploy:
    name: Deploy a VPS
    needs: test
    # Solo commits de main (push o ejecución manual sobre main); nunca PRs ni otras ramas.
    # Crítico: este job corre en el runner self-hosted instalado en el VPS de producción.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, production]
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL || 'https://snake.enoblega.com.ar' }}
    # Un deploy a la vez; los pendientes esperan en orden.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_DIR: /opt/apps/app_snake
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://snake.enoblega.com.ar' }}
    steps:
      # Ejecución local en el VPS: deploy.sh actualiza el checkout de APP_DIR al
      # commit indicado, reconstruye, levanta y verifica el servicio.
      # Corre como "deploy" (dueño del repo, grupo docker) mediante una regla
      # sudoers que solo permite a github-runner ejecutar este script como deploy.
      - name: Deploy local en el VPS
        run: |
          cd /
          sudo -n -H -u deploy "$APP_DIR/scripts/deploy.sh" "$GITHUB_SHA"

      - name: Verificar URL pública
        run: |
          expected="$(grep -oE 'APP_VERSION = "[^"]+"' "$APP_DIR/src/game.js")"
          for i in 1 2 3 4 5; do
            served="$(curl -fsS --max-time 10 "$PUBLIC_URL/game.js" | grep -oE 'APP_VERSION = "[^"]+"' || true)"
            if [ "$served" = "$expected" ]; then
              echo "$PUBLIC_URL responde con $served"
              exit 0
            fi
            echo "Intento $i: versión pública '${served:-sin respuesta}', esperada '$expected'"
            sleep 10
          done
          echo "::error::$PUBLIC_URL no sirve la versión desplegada"
          exit 1
