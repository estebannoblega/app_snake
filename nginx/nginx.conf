# Configuración mínima de Nginx para servir Snake como sitio estático.
# Preparada para ejecutarse como usuario no-root (nginx, uid 101):
# el pid y los archivos temporales se escriben en /tmp.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log    /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip        on;
    gzip_types  text/css application/javascript;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Los assets no tienen hash en el nombre: el navegador revalida
        # (ETag) para que una nueva versión se vea tras un rebuild.
        add_header  Cache-Control           "no-cache" always;
        add_header  X-Content-Type-Options  "nosniff" always;

        location / {
            try_files  $uri $uri/ =404;
        }
    }
}
