name: snake-cicd

services:
  snake:
    build: .
    image: snake-cicd:latest
    # Sin puertos publicados en el host: el reverse proxy llega a la app
    # por la red proxy-net en http://snake-cicd:80.
    networks:
      proxy-net:
        aliases:
          - snake-cicd
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  proxy-net:
    # Red de la infraestructura del reverse proxy: debe existir previamente
    # y este proyecto no la crea ni la elimina.
    external: true
